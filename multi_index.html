function ethernetKind(prefix){const p=prefix.toLowerCase();if(p==='gigabitethernet'||p==='ge')return 'GE';if(p==='xgigabitethernet'||p==='xge'||p==='10ge')return 'XGE';if(p==='25ge'||p==='40ge'||p==='100ge'||p==='2.5ge')return p.toUpperCase();return 'ETH'}
function ethernetPorts(o){return (o.interfaces||[]).map(i=>{const m=String(i.name||'').match(/^(ethernet|gigabitethernet|xgigabitethernet|(?:10|25|40|100)ge|2\.5ge|ge|xge)(\d+)\/(\d+)\/(\d+)$/i);return m?{...i,port_type:ethernetKind(m[1]),frame:+m[2],slot:+m[3],port:+m[4],sfp:`${+m[2]}/${+m[3]}/${+m[4]}`} : null}).filter(Boolean)}
function ethernetBoards(o){const groups=new Map();for(const p of ethernetPorts(o)){const key=`${p.frame}/${p.slot}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)}return [...groups].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true})).map(([key,ports])=>{const kinds=[...new Set(ports.map(p=>p.port_type))].join(' · ');return `<div class="board" style="background:linear-gradient(135deg,#173b49,#152b34);border-color:#3a7180"><div class="board-title"><span style="color:#79e5ef">PLACA ${esc(kinds)} · ${esc(key)}</span><small>${ports.length} portas</small></div><div class="pon-grid">${ports.sort((a,b)=>a.port-b.port).map(p=>`<button class="pon eth-port ${p.status==='up'?'online':'offline'}" data-olt="${esc(o.id)}" data-eth-index="${esc(p.index)}" title="${esc(p.port_type)} ${esc(p.sfp)}: ${p.status==='up'?'Online':'Offline'}"><span>${esc(p.port_type)} ${esc(p.port)}</span></button>`).join('')}</div></div>`}).join('')}
function boards(o){const groups=new Map();for(const p of o.pons){const key=p.frame!=null&&p.slot!=null?`${p.frame}/${p.slot}`:'Indefinida';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)}const gpon=[...groups].map(([key,ports])=>`<div class="board"><div class="board-title"><span>PLACA GPON · ${esc(key)}</span><small>${ports.length} portas</small></div><div class="pon-grid">${ports.sort((a,b)=>(a.port??999)-(b.port??999)).map(p=>`<button class="pon ${esc(p.status)}" data-olt="${esc(o.id)}" data-index="${esc(p.index)}" title="GPON ${esc(p.sfp)}: ${status(p.status)}"><span>${p.port==null?'?':esc(p.port)}</span></button>`).join('')}</div></div>`).join('');return (gpon||'<div class="muted">Aguardando descoberta das portas GPON</div>')+ethernetBoards(o)}
function ethernetDetail(o,i){const p=ethernetPorts(o).find(x=>x.index===i.index)||i;return `<div class="detail-head"><div><div class="eyebrow">Interface ${esc(p.port_type||'Ethernet')}</div><h3>${esc(p.port_type||'Ethernet')} ${esc(p.sfp||p.name)}</h3></div><span class="badge ${p.status==='up'?'':'warn'}">${p.status==='up'?'Online':'Offline'}</span></div>${p.alias?`<div class="notice-panel">Descrição: ${esc(p.alias)}</div>`:''}<h4>Tráfego da interface</h4><div class="tiles">${tile('Download',rate(p.in_bps),`Acumulado: ${bytes(p.in_octets)}`)}${tile('Upload',rate(p.out_bps),`Acumulado: ${bytes(p.out_octets)}`)}${tile('Índice SNMP',esc(p.index))}${tile('Estado',p.status==='up'?'Online':'Offline')}</div><div class="stats"><span class="stat">Coleta: ${esc(date(o.collected_at))}</span></div>`}
const icons={fan:'<circle cx="12" cy="12" r="2"/><path d="M12 10c-3-7 5-9 5-4 0 2-2 4-3 5M14 12c7-3 9 5 4 5-2 0-4-2-5-3M12 14c3 7-5 9-5 4 0-2 2-4 3-5M10 12c-7 3-9-5-4-5 2 0 4 2 5 3"/>',thermo:'<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0Z"/><path d="M12 8v9"/>',memory:'<rect x="3" y="7" width="18" height="10" rx="1"/><path d="M6 10h3m2 0h3m2 0h2M6 14h12M5 4v3m4-3v3m4-3v3m4-3v3m-12 10v3m4-3v3m4-3v3m4-3v3"/>',cpu:'<rect x="6" y="6" width="12" height="12" rx="1"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>',autofind:'<circle cx="11" cy="11" r="6"/><path d="m16 16 5 5M8 11h6M11 8v6"/>'};
function card(o){const ping=o.ping_ms==null?'Sem resposta':`${decimal(o.ping_ms,o.ping_ms<10?1:0)} ms`;const snmp=o.snmp_ok===true?'OK':o.snmp_ok===false?'Falha':'Aguardando';return `<section class="olt" id="${esc(o.id)}"><div class="top"><div><div class="eyebrow">Huawei · ${esc(o.host)}</div><h2>${esc(o.name)}</h2><div class="muted">${o.pons.length} PONs em ${new Set(o.pons.map(p=>`${p.frame}/${p.slot}`)).size} placas · ${o.ont_count} ONTs na última leitura</div></div><div class="top-metrics"><div class="top-metric"><small>Ping</small><strong class="${o.ping_ms==null?'bad':'good'}">${esc(ping)}</strong></div><div class="top-metric"><small>Uptime</small><strong>${esc(o.uptime||'Sem leitura')}</strong></div><div class="top-metric"><small>SNMP</small><strong class="${o.snmp_ok===true?'good':o.snmp_ok===false?'bad':''}">${esc(snmp)}</strong></div><div class="badge ${o.status==='online'?'':'warn'}">${o.status==='online'?'Coleta normal':o.status==='degraded'?'Coleta parcial':o.status==='parcial'?'PONs detectadas':'Aguardando dados'}</div></div></div><div class="layout"><div class="chassis"><div class="chassis-head"><span>OLT / GPON</span><span>S/F/P</span></div><div class="boards">${boards(o)}</div><div class="health-bar">${[['fan','Ventilação'],['thermo','Temperatura'],['memory','Memória'],['cpu','Processador'],['autofind','Autofind']].map(([key,label])=>`<button class="health" data-olt="${esc(o.id)}" data-health="${key}" title="Informações da OLT: ${label}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[key]}</svg><span>${label}</span></button>`).join('')}</div></div><div class="details" id="detail-${esc(o.id)}">${healthIntro()}</div></div><div class="lower"><span>Coleta completa: <strong>${esc(date(o.collected_at))}</strong></span><span>Estado das PONs: <strong>${esc(date(o.fast_collected_at))}</strong></span>${o.collection_note?`<span class="off">Nota: ${esc(o.collection_note)}</span>`:''}${o.collection_warning?`<span class="off">${esc(o.collection_warning)}</span>`:''}</div></section>`}
function card(o){const ping=o.ping_ms==null?'Sem resposta':`${decimal(o.ping_ms,o.ping_ms<10?1:0)} ms`;const snmp=o.snmp_ok===true?'OK':o.snmp_ok===false?'Falha':'Aguardando';const isOpen=expanded.has(o.id);return `<section class="olt ${isOpen?'':'collapsed'}" id="${esc(o.id)}"><div class="top" data-toggle-olt="${esc(o.id)}" role="button" tabindex="0" aria-expanded="${isOpen}"><div><div class="eyebrow">Huawei · ${esc(o.host)}</div><h2>${esc(o.name)}</h2><div class="muted">${o.pons.length} PONs em ${new Set(o.pons.map(p=>`${p.frame}/${p.slot}`)).size} placas · ${o.ont_count} ONTs na última leitura</div></div><div class="top-metrics"><div class="top-metric"><small>Ping</small><strong class="${o.ping_ms==null?'bad':'good'}">${esc(ping)}</strong></div><div class="top-metric"><small>Uptime</small><strong>${esc(o.uptime||'Sem leitura')}</strong></div><div class="top-metric"><small>SNMP</small><strong class="${o.snmp_ok===true?'good':o.snmp_ok===false?'bad':''}">${esc(snmp)}</strong></div><div class="badge ${o.status==='online'?'':'warn'}">${o.status==='online'?'Coleta normal':o.status==='degraded'?'Coleta parcial':o.status==='parcial'?'PONs detectadas':'Aguardando dados'}</div><button class="olt-toggle" type="button">${isOpen?'Recolher':'Abrir OLT'}</button></div></div><div class="layout"><div class="chassis"><div class="chassis-head"><span>OLT / GPON</span><span>S/F/P</span></div><div class="boards">${boards(o)}</div><div class="health-bar">${[['fan','Ventilação'],['thermo','Temperatura'],['memory','Memória'],['cpu','Processador'],['autofind','Autofind']].map(([key,label])=>`<button class="health" data-olt="${esc(o.id)}" data-health="${key}" title="Informações da OLT: ${label}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[key]}</svg><span>${label}</span></button>`).join('')}</div></div><div class="details" id="detail-${esc(o.id)}">${healthIntro()}</div></div><div class="lower"><span>Coleta completa: <strong>${esc(date(o.collected_at))}</strong></span><span>Estado das PONs: <strong>${esc(date(o.fast_collected_at))}</strong></span>${o.collection_note?`<span class="off">Nota: ${esc(o.collection_note)}</span>`:''}${o.collection_warning?`<span class="off">${esc(o.collection_warning)}</span>`:''}</div></section>`}
function render(){document.getElementById('main').innerHTML=olts.map(card).join('');for(const [id,index] of selected){const o=olts.find(x=>x.id===id);if(!o)continue;if(['fan','thermo','memory','cpu','autofind'].includes(index)){document.getElementById(`detail-${id}`).innerHTML=health(o,index);const button=document.querySelector(`#${CSS.escape(id)} .health[data-health="${index}"]`);if(button)button.classList.add('selected');continue}if(String(index).startsWith('eth:')){const ethIndex=String(index).slice(4),iface=ethernetPorts(o).find(x=>String(x.index)===ethIndex);if(!iface)continue;const button=document.querySelector(`#${CSS.escape(id)} .eth-port[data-eth-index="${CSS.escape(ethIndex)}"]`);if(button)button.classList.add('selected');document.getElementById(`detail-${id}`).innerHTML=ethernetDetail(o,iface);continue}const p=o.pons.find(x=>x.index===index);if(!p)continue;const button=[...document.querySelectorAll(`#${CSS.escape(id)} .pon:not(.eth-port)`)].find(x=>x.dataset.index===index);if(button)button.classList.add('selected');document.getElementById(`detail-${id}`).innerHTML=detail(o,p)}}
document.addEventListener('click',e=>{const hide=e.target.closest('[data-hide-onts]');if(!hide)return;const panel=document.getElementById(hide.dataset.panel);const entry=[...selected].find(([id,index])=>`ont-panel-${id}-${index}`===hide.dataset.panel);if(panel&&entry)panel.innerHTML=`<button type="button" class="ont-show" data-show-onts="1" data-olt="${esc(entry[0])}" data-index="${esc(entry[1])}">Exibir ONTs desta GPON</button>`;e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('click',async e=>{const show=e.target.closest('[data-show-onts]');if(show){const o=olts.find(item=>item.id===show.dataset.olt);const p=o?.pons.find(item=>item.index===show.dataset.index);if(!o||!p)return;const panel=document.getElementById(`ont-panel-${o.id}-${p.index}`);if(panel)panel.innerHTML='<p class="muted">Carregando ONTs…</p>';try{const response=await fetch(`/api/onts?olt=${encodeURIComponent(o.id)}&sfp=${encodeURIComponent(p.sfp)}`,{credentials:'same-origin'});if(!response.ok)throw Error('Falha ao carregar ONTs');ontCache.set(ontKey(o,p),await response.json());if(panel)panel.innerHTML=ontPanel(o,p)}catch(error){if(panel)panel.innerHTML='<p class="off">Não foi possível carregar as ONTs desta GPON.</p>'}return}const hide=e.target.closest('[data-hide-onts]');if(hide){const panel=document.getElementById(hide.dataset.panel);if(panel)panel.innerHTML=`<button type="button" class="ont-show" data-show-onts="1" data-olt="${esc(panel.id.split('-')[2])}" data-index="${esc(panel.id.split('-').slice(3).join('-'))}">Exibir ONTs desta GPON</button>`}});
document.addEventListener('input',e=>{const input=e.target.closest('[data-ont-search]');if(!input)return;const panel=document.getElementById(input.dataset.ontSearch);if(!panel)return;const term=input.value.trim().toLocaleLowerCase('pt-BR');let visible=0;panel.querySelectorAll('[data-ont-row]').forEach(row=>{const match=row.dataset.search.includes(term);row.hidden=!match;if(match)visible++});const result=panel.querySelector('[data-ont-result]');if(result)result.textContent=`${visible} ONT${visible===1?'':'s'} encontrada${visible===1?'':'s'}`});
document.addEventListener('click',async e=>{const button=e.target.closest('[data-query-autofind]');if(!button)return;const id=button.dataset.queryAutofind,o=olts.find(item=>item.id===id),panel=document.getElementById(`detail-${id}`);if(!o||!panel)return;button.disabled=true;panel.innerHTML='<h3>ONTs não provisionadas</h3><p class="muted">Acessando OLT…</p>';let waiting=true;const progress=setTimeout(()=>{if(waiting)panel.innerHTML='<h3>ONTs não provisionadas</h3><p class="muted">Verificando ONTs…</p>'},1200);try{const response=await fetch(`/api/autofind?olt=${encodeURIComponent(id)}`,{cache:'no-store',credentials:'same-origin'});const data=await response.json();if(!response.ok)throw Error(data.error||'Falha na consulta');autofindResults.set(id,data);panel.innerHTML=autofind(o)}catch(error){panel.innerHTML=`<h3>ONTs não provisionadas</h3><p class="off">${esc(error.message)}</p><button type="button" class="ont-show" data-query-autofind="${esc(id)}">Tentar novamente</button>`}finally{waiting=false;clearTimeout(progress)}});
document.addEventListener('input',e=>{const input=e.target.closest('[data-ont-search]');if(!input)return;const panel=document.getElementById(input.dataset.ontSearch),filters=panel?.querySelectorAll('[data-ont-search]');if(!panel||!filters)return;const values={};filters.forEach(field=>values[field.dataset.field]=field.value.trim().toLocaleLowerCase('pt-BR'));let visible=0;panel.querySelectorAll('[data-ont-row]').forEach(row=>{const match=Object.entries(values).every(([field,value])=>!value||row.dataset[field].includes(value));row.hidden=!match;if(match)visible++});const result=panel.querySelector('[data-ont-result]');if(result)result.textContent=`${visible} ONT${visible===1?'':'s'} encontrada${visible===1?'':'s'}`});
document.addEventListener('click',e=>{const toggle=e.target.closest('[data-toggle-olt]');if(!toggle)return;const id=toggle.dataset.toggleOlt;if(expanded.has(id))expanded.delete(id);else expanded.add(id);render()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;if(e.target.closest('button'))return;const toggle=e.target.closest('[data-toggle-olt]');if(!toggle)return;e.preventDefault();const id=toggle.dataset.toggleOlt;if(expanded.has(id))expanded.delete(id);else expanded.add(id);render()});
render();
document.addEventListener('click',e=>{const h=e.target.closest('.health');if(h){const o=olts.find(x=>x.id===h.dataset.olt);if(o){selected.set(o.id,h.dataset.health);document.getElementById(`detail-${o.id}`).innerHTML=health(o,h.dataset.health);document.querySelectorAll(`#${CSS.escape(o.id)} .pon`).forEach(x=>x.classList.remove('selected'));document.querySelectorAll(`#${CSS.escape(o.id)} .health`).forEach(x=>x.classList.remove('selected'));h.classList.add('selected')}return}const eth=e.target.closest('.eth-port');if(eth){const o=olts.find(x=>x.id===eth.dataset.olt),i=ethernetPorts(o||{}).find(x=>String(x.index)===eth.dataset.ethIndex);if(!o||!i)return;selected.set(o.id,`eth:${i.index}`);document.querySelectorAll(`#${CSS.escape(o.id)} .pon,#${CSS.escape(o.id)} .health`).forEach(x=>x.classList.remove('selected'));eth.classList.add('selected');document.getElementById(`detail-${o.id}`).innerHTML=ethernetDetail(o,i);return}const b=e.target.closest('.pon');if(!b)return;const o=olts.find(x=>x.id===b.dataset.olt),p=o?.pons.find(x=>x.index===b.dataset.index);if(!p)return;selected.set(o.id,p.index);document.querySelectorAll(`#${CSS.escape(o.id)} .pon`).forEach(x=>x.classList.remove('selected'));document.querySelectorAll(`#${CSS.escape(o.id)} .health`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById(`detail-${o.id}`).innerHTML=detail(o,p)});
async function refresh(){try{if(document.visibilityState!=='hidden'){const response=await fetch('/api/state',{cache:'no-store',credentials:'same-origin'});if(response.status===401){location.assign('/login');return}if(!response.ok)throw Error('Falha na atualização');olts=await response.json();render();document.getElementById('sync').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR')}}catch(e){document.getElementById('sync').textContent='Sem conexão · tentando novamente'}finally{setTimeout(refresh,60000)}}
refresh();
</script></body></html>
