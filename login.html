<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · LVL - gerenciador de OLTs</title>
<style>:root{font-family:Segoe UI,Arial,sans-serif;color:#ecf7fa;background:#08121c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#20506180,transparent 45%),#08121c}.box{width:min(420px,calc(100% - 32px));background:#102330;border:1px solid #315360;border-radius:18px;padding:32px;box-shadow:0 22px 60px #0008}.eyebrow{color:#62d4e6;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800}h1{font-size:28px;margin:6px 0 24px}label{display:block;color:#a5bfca;font-size:13px;font-weight:700;margin:16px 0 6px}input{width:100%;background:#081620;color:white;border:1px solid #42606a;border-radius:9px;padding:12px;font-size:16px}input:focus{outline:2px solid #5dcfe2}button{width:100%;margin-top:23px;padding:12px;border:0;border-radius:9px;background:#197d91;color:white;font-size:15px;font-weight:800;cursor:pointer}.error{min-height:20px;color:#ff9aa2;font-size:13px;margin-top:14px}.foot{color:#8ba7b3;font-size:12px;margin-top:16px}</style></head>
<body><main class="box"><div class="eyebrow">LVL</div><h1>Gerenciador de OLTs</h1><form method="post" action="/login" autocomplete="on"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><div class="error" role="alert">__ERROR__</div><div class="foot">Acesso restrito a usuários autorizados.</div></main></body></html>
